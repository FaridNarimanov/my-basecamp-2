<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="user-profile-page">
    <div class="container">
        <!-- Back navigation -->
        <div class="profile-nav-bar">
            <a href="#" onclick="window.history.back(); return false;" class="profile-back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back
            </a>
        </div>

        <div class="profile-card" id="profileContent">
            <p class="empty-message">Loading user profile...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        const defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2JkYzNjNyI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';

        function safeAvatarSrc(src) {
            return typeof src === 'string' && src.startsWith('/uploads/') ? src : defaultAvatar;
        }

        function showError(message) {
            const content = document.getElementById('profileContent');
            content.replaceChildren();
            const heading = document.createElement('h3');
            heading.className = 'error-heading';
            heading.textContent = message;
            content.appendChild(heading);
        }

        async function loadUserProfile() {
            if (!username) {
                showError('User not found');
                return;
            }

            try {
                const response = await fetch(`/api/users/${username}`);
                if (!response.ok) throw new Error('User not found');
                
                const user = await response.json();
                const avatarSrc = safeAvatarSrc(user.profile_pic);
                const displayName = user.name || 'Unknown User';
                const content = document.getElementById('profileContent');
                content.replaceChildren();

                const avatar = document.createElement('img');
                avatar.src = avatarSrc;
                avatar.alt = 'Avatar';
                avatar.className = 'avatar-large';

                const nameEl = document.createElement('h1');
                nameEl.className = 'user-name';
                nameEl.textContent = displayName;

                const usernameEl = document.createElement('p');
                usernameEl.className = 'user-username';
                usernameEl.textContent = '@' + (user.username || '');

                const roleEl = document.createElement('span');
                roleEl.className = 'role-badge';
                roleEl.textContent = user.role || '';

                const lineBreak = document.createElement('br');

                const infoBox = document.createElement('div');
                infoBox.className = 'info-box';
                infoBox.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>';
                infoBox.appendChild(document.createTextNode(user.email || ''));

                content.append(avatar, nameEl, usernameEl, roleEl, lineBreak, infoBox);
            } catch (error) {
                showError('User not found or does not exist.');
            }
        }

        loadUserProfile();
    </script>
</body>
</html>
