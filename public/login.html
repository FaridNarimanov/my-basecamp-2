<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - My Basecamp</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="form-page login-page">
    <div class="container form-container">
        <h2 class="page-title">Login</h2>
        <div id="msgBox" class="message-box"></div>
        <form id="loginForm">
            <input type="text" id="email" placeholder="Email or Username" required>
            <div class="input-icon-wrapper">
                <input type="password" id="password" placeholder="Password" required>
                <span class="eye-icon" onclick="togglePassword('password')" title="Show/Hide Password">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </span>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="footer-link">
            <span>Don't have an account?</span> <a href="/register">Register</a>
        </div>
    </div>

    <script>
        const msgBox = document.getElementById('msgBox');
        function showMessage(text, isError = false) {
            msgBox.textContent = text;
            msgBox.className = 'message-box ' + (isError ? 'error' : 'success');
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = result.role === 'admin' ? '/admin' : '/dashboard';
                    }, 900);
                } else {
                    showMessage(result.message, true);
                }
            } catch {
                showMessage("A system error occurred.", true);
            }
        });
    </script>
</body>
</html>
